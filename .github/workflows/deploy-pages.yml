name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test deployment paths
        run: npm test

      - name: Build site
        run: npm run build
        env:
          # Custom domain (www.mingswaterloo.com) serves the site at the root,
          # so the base path must be "/" — a repository-subdirectory base would
          # make every asset 404 and the page render blank.
          VITE_BASE_PATH: /

      - name: Add static-host support
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          echo "www.mingswaterloo.com" > dist/CNAME

      - name: Publish built site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
